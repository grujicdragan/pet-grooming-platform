spring:
  application:
    name: pet-grooming-api
  datasource:
    url: jdbc:postgresql://localhost:5432/petgrooming
    username: petgrooming
    password: petgrooming
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:4200,http://127.0.0.1:4200
