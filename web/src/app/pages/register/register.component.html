<section class="panel auth">
  <p class="eyebrow">{{ 'register.eyebrow' | t }}</p>
  <h1>{{ 'register.title' | t }}</h1>
  <p class="lede">{{ 'register.lede' | t }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span>{{ 'auth.name' | t }}</span>
      <input type="text" formControlName="name" autocomplete="name" [placeholder]="'auth.namePlaceholder' | t" />
      @if (submitted && form.controls.name.invalid) {
        <small class="error">{{ 'auth.nameError' | t }}</small>
      }
    </label>

    <label class="field">
      <span>{{ 'auth.email' | t }}</span>
      <input type="email" formControlName="email" autocomplete="email" [placeholder]="'auth.emailPlaceholder' | t" />
      @if (submitted && form.controls.email.invalid) {
        <small class="error">{{ 'auth.emailError' | t }}</small>
      }
    </label>

    <label class="field">
      <span>{{ 'auth.password' | t }}</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (submitted && form.controls.password.invalid) {
        <small class="error">{{ 'auth.passwordError' | t }}</small>
      }
    </label>

    <button class="btn btn-primary" type="submit">{{ 'register.submit' | t }}</button>
  </form>

  <p class="switch">{{ 'register.hasAccount' | t }} <a routerLink="/login">{{ 'register.login' | t }}</a></p>
</section>
