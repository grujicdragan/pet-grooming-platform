<section class="panel auth">
  <p class="eyebrow">Registracija</p>
  <h1>Otvori nalog</h1>
  <p class="lede">Novi nalog kreće od nule. Auth dolazi u sledećoj fazi — ovo je privremeni demo.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span>Ime</span>
      <input type="text" formControlName="name" autocomplete="name" placeholder="Ana" />
      @if (submitted && form.controls.name.invalid) {
        <small class="error">Unesi ime.</small>
      }
    </label>

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" placeholder="ana@primer.rs" />
      @if (submitted && form.controls.email.invalid) {
        <small class="error">Potreban je validan email.</small>
      }
    </label>

    <label class="field">
      <span>Lozinka</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (submitted && form.controls.password.invalid) {
        <small class="error">Lozinka mora imati bar 4 karaktera.</small>
      }
    </label>

    <button class="btn btn-primary" type="submit">Napravi nalog</button>
  </form>

  <p class="switch">Već imaš nalog? <a routerLink="/login">Prijavi se</a></p>
</section>
