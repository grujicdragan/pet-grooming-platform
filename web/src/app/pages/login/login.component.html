<section class="panel auth">
  <p class="eyebrow">Prijava</p>
  <h1>Dobrodošli nazad</h1>
  <p class="lede">Unesi bilo koji email i lozinku (min. 4 karaktera). Nalog ostaje samo dok je tab otvoren.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" placeholder="ana@primer.rs" />
      @if (submitted && form.controls.email.invalid) {
        <small class="error">Potreban je validan email.</small>
      }
    </label>

    <label class="field">
      <span>Lozinka</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (submitted && form.controls.password.invalid) {
        <small class="error">Lozinka mora imati bar 4 karaktera.</small>
      }
    </label>

    <button class="btn btn-primary" type="submit">Prijavi se</button>
  </form>

  <p class="switch">Nemaš nalog? <a routerLink="/register">Registruj se</a></p>
</section>
