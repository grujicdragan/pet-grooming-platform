<section class="panel auth">
  <p class="eyebrow">{{ 'login.eyebrow' | t }}</p>
  <h1>{{ 'login.title' | t }}</h1>
  <p class="lede">{{ 'login.lede' | t }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span>{{ 'auth.email' | t }}</span>
      <input type="email" formControlName="email" autocomplete="email" [placeholder]="'auth.emailPlaceholder' | t" />
      @if (submitted && form.controls.email.invalid) {
        <small class="error">{{ 'auth.emailError' | t }}</small>
      }
    </label>

    <label class="field">
      <span>{{ 'auth.password' | t }}</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (submitted && form.controls.password.invalid) {
        <small class="error">{{ 'auth.passwordError' | t }}</small>
      }
    </label>

    <button class="btn btn-primary" type="submit">{{ 'login.submit' | t }}</button>
  </form>

  <p class="switch">{{ 'login.noAccount' | t }} <a routerLink="/register">{{ 'login.register' | t }}</a></p>
</section>
