name: Keep API awake

# Render free instances sleep after ~15 min idle. GitHub cron can run late, so ping every 10 min.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 5 --max-time 60 "${API_URL}/api/health"
        env:
          API_URL: ${{ vars.API_URL || 'https://pet-grooming-platform-irlk.onrender.com' }}
